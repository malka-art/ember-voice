<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; media-src 'self' mediastream:; img-src 'self' data:"
    />
    <title>Ember</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="stack">
      <section id="approval" class="card" hidden aria-live="assertive">
        <p id="approval-title" class="card-title"></p>
        <p id="approval-detail" class="card-detail"></p>
        <div class="card-actions">
          <button id="approval-deny" class="text-button" type="button">Don't allow</button>
          <button id="approval-allow" class="text-button primary" type="button">Allow</button>
        </div>
      </section>

      <!-- What you said, as the bar understood it, until it reaches the thread. -->
      <section id="heard" class="card heard" hidden aria-live="polite">
        <p id="heard-text" class="heard-text"></p>
      </section>

      <section id="settings" class="card settings" hidden aria-label="Settings">
        <div class="setting setting-row">
          <label class="setting-label" for="set-voices">Voice</label>
          <select id="set-voices" class="select"></select>
        </div>
        <div class="setting setting-row">
          <label class="setting-label" for="set-speed">Speed</label>
          <input id="set-speed" class="slider" type="range" min="0.8" max="1.6" step="0.05" value="1.3" />
          <output id="set-speed-value" class="slider-value" for="set-speed">1.30x</output>
        </div>
        <div class="setting setting-row">
          <p class="setting-label" id="follow-label">Keep listening</p>
          <div id="set-follow" class="segmented" role="radiogroup" aria-labelledby="follow-label"></div>
        </div>
        <div class="setting setting-row">
          <p class="setting-label" id="wake-label">Wake word</p>
          <div id="set-wake" class="segmented" role="radiogroup" aria-labelledby="wake-label"></div>
        </div>
        <div class="setting setting-row">
          <p class="setting-label" id="theme-label">Appearance</p>
          <div id="set-theme" class="segmented" role="radiogroup" aria-labelledby="theme-label"></div>
        </div>
      </section>

      <!-- Only shown when something needs your attention. -->
      <section id="note" class="card note" hidden role="status" aria-live="polite">
        <p id="note-text" class="note-text"></p>
      </section>

      <div id="bar" class="bar" data-state="starting" data-wake="awake">
        <button id="orb" class="orb" type="button" aria-label="Stop the reply" title="Stop the reply">
          <span class="halo" aria-hidden="true"></span>
          <canvas id="orb-canvas" width="96" height="96"></canvas>
        </button>

        <div id="readout" class="readout">
          <p id="session" class="session"></p>
          <input id="typed" class="typed" type="text" placeholder="Type, then Enter" hidden />
        </div>

        <div class="controls">
          <button id="mic" class="icon-button" type="button" aria-pressed="true" aria-label="Mute the microphone" title="Mute the microphone">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3.5" width="6" height="11" rx="3" />
              <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5" />
              <path class="slash" d="M4.5 4.5l15 15" />
            </svg>
          </button>
          <button id="voice" class="icon-button" type="button" aria-pressed="true" aria-label="Turn the voice off" title="Turn the voice off">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5h3l4.5-4v13l-4.5-4H4z" />
              <path class="waves" d="M15 9a4.2 4.2 0 0 1 0 6M17.6 6.6a7.6 7.6 0 0 1 0 10.8" />
              <path class="slash" d="M4.5 4.5l15 15" />
            </svg>
          </button>
          <button id="approvals" class="icon-button" type="button" aria-label="Nothing is waiting for approval" title="Nothing is waiting for approval">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.5l7 2.6v5.2c0 4.2-2.8 7.6-7 9.2-4.2-1.6-7-5-7-9.2V6.1z" />
              <path d="M9 12l2.2 2.2L15.2 10" />
            </svg>
            <span id="badge" class="badge" hidden>0</span>
          </button>
          <button id="gear" class="icon-button" type="button" aria-expanded="false" aria-controls="settings" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="2.6" />
              <path
                transform="translate(12 12) scale(0.78) translate(-12 -12)"
                vector-effect="non-scaling-stroke"
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>
          <button id="close" class="icon-button close" type="button" aria-label="Close Ember" title="Close Ember">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7.5 7.5l9 9M16.5 7.5l-9 9" />
            </svg>
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
